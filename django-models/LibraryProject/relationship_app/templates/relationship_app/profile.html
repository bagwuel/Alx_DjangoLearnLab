<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
    {% if user.is_authenticated %}

    <h1>Welcome {{ user.username }}</h1>

    <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
    </form>

    {% else %}

        <h1>You are not logged in</h1>

    {% endif %}
</body>
</html>
